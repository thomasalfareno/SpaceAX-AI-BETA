<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <!-- Window Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Clip Paths for Typing Lines -->
    <!-- Screen 1: Command 1 (Length: 39 chars, starts at x=151, width=328) -->
    <clipPath id="clip-cmd1">
      <rect x="151" y="-15" width="0" height="25">
        <animate attributeName="width" values="0;328;328" keyTimes="0;0.8;1" dur="2.2s" begin="0.5s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Screen 2: Command 2 (Length: 19 chars, starts at x=151, width=160) -->
    <clipPath id="clip-cmd2">
      <rect x="151" y="-15" width="0" height="25">
        <animate attributeName="width" values="0;160;160" keyTimes="0;0.8;1" dur="1.5s" begin="9.0s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Screen 2: User Input (Length: 18 chars, starts at x=50, width=152) -->
    <clipPath id="clip-user1">
      <rect x="50" y="-15" width="0" height="25">
        <animate attributeName="width" values="0;152;152" keyTimes="0;0.8;1" dur="1.5s" begin="12.0s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Screen 2: Bot Reply Line 1 (Length: 40 chars, starts at x=76, width=336) -->
    <clipPath id="clip-bot-l1">
      <rect x="76" y="-15" width="0" height="25">
        <animate attributeName="width" values="0;336;336" keyTimes="0;0.32;1" dur="2.5s" begin="14.2s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Screen 2: Bot Reply Line 2 (Length: 29 chars, starts at x=76, width=244) -->
    <clipPath id="clip-bot-l2">
      <rect x="76" y="10" width="0" height="25">
        <animate attributeName="width" values="0;0;244;244" keyTimes="0;0.36;0.64;1" dur="2.5s" begin="14.2s" repeatCount="indefinite" />
      </rect>
    </clipPath>

    <!-- Screen 2: Bot Reply Line 3 (Length: 40 chars, starts at x=76, width=336) -->
    <clipPath id="clip-bot-l3">
      <rect x="76" y="35" width="0" height="25">
        <animate attributeName="width" values="0;0;336;336" keyTimes="0;0.68;1" dur="2.5s" begin="14.2s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .terminal-window {
      fill: #0f141c;
      stroke: #1b2433;
      stroke-width: 1.5;
      rx: 10px;
    }
    .title-bar {
      fill: #171d26;
      stroke: #222b38;
      stroke-width: 1.5;
    }
    .window-title {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace;
      font-size: 13px;
      fill: #707a8a;
      font-weight: 500;
    }
    .term-text {
      font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, 'Courier New', monospace;
      font-size: 14px;
      fill: #abb2bf;
      letter-spacing: 0px;
    }
    .prompt {
      fill: #61afef;
      font-weight: bold;
    }
    .command {
      fill: #98c379;
    }
    .output-info {
      fill: #5c6370;
    }
    .output-success {
      fill: #98c379;
    }
    .output-warning {
      fill: #d19a66;
    }
    .user-prompt {
      fill: #e5c07b;
      font-weight: bold;
    }
    .user-command {
      fill: #abb2bf;
    }
    .bot-prompt {
      fill: #c678dd;
      font-weight: bold;
    }
    .bot-reply {
      fill: #56b6c2;
    }
    .cursor {
      fill: #528bff;
    }
  </style>

  <!-- Terminal Window Background with Shadow -->
  <rect x="15" y="15" width="820" height="370" class="terminal-window" filter="url(#shadow)" />

  <!-- Title Bar -->
  <path d="M 15 25 A 10 10 0 0 1 25 15 L 825 15 A 10 10 0 0 1 835 25 L 835 50 L 15 50 Z" class="title-bar" />
  
  <!-- Window Control Buttons (macOS style) -->
  <circle cx="40" cy="32" r="6" fill="#ff5f56" />
  <circle cx="60" cy="32" r="6" fill="#ffbd2e" />
  <circle cx="80" cy="32" r="6" fill="#27c93f" />

  <!-- Window Title -->
  <text x="425" y="36" text-anchor="middle" class="window-title">SpaceAx AI v2.0.0 — Terminal</text>

  <!-- ================= SCREEN 1: TRAINING PANEL ================= -->
  <g class="term-text">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.43;0.46;0.97;1" dur="18s" repeatCount="indefinite" />
    
    <!-- Command Line -->
    <g transform="translate(40, 85)">
      <text x="0" y="0"><tspan class="prompt">thomas@spaceax:~$ </tspan></text>
      <!-- Typed text with clip -->
      <text x="151" y="0" class="command" clip-path="url(#clip-cmd1)">python main.py train --regen --epochs 30</text>
      
      <!-- Blinking Cursor (animates exactly to the end of the text) -->
      <rect class="cursor" x="151" y="-12" width="8" height="15">
        <animate attributeName="x" values="151;479;479" keyTimes="0;0.8;1" dur="2.2s" begin="0.5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        <!-- Hide when training output starts -->
        <animate attributeName="visibility" to="hidden" begin="2.7s" dur="18s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Training Outputs (staggered delay) -->
    <g transform="translate(40, 115)">
      <text x="0" y="0">🚀 Memuat leksikon KBBI...</text>
      <animate attributeName="visibility" from="hidden" to="visible" begin="3.0s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.0s" repeatCount="indefinite" fill="freeze" />
    </g>

    <g transform="translate(40, 145)">
      <text x="0" y="0" class="output-success">📚 Leksikon dimuat: 112,847 kata unik</text>
      <animate attributeName="visibility" from="hidden" to="visible" begin="3.8s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="3.8s" repeatCount="indefinite" fill="freeze" />
    </g>

    <g transform="translate(40, 175)">
      <text x="0" y="0">🏗️ Inisialisasi Model Transformer...</text>
      <animate attributeName="visibility" from="hidden" to="visible" begin="4.6s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="4.6s" repeatCount="indefinite" fill="freeze" />
    </g>

    <g transform="translate(40, 205)">
      <text x="0" y="0" class="output-warning">⚡ ProMax 1B — 1.2B parameters (RAM: 48GB, VRAM: 16GB)</text>
      <animate attributeName="visibility" from="hidden" to="visible" begin="5.5s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="5.5s" repeatCount="indefinite" fill="freeze" />
    </g>

    <g transform="translate(40, 245)">
      <text x="0" y="0">🎯 Training epoch 1/30</text>
      <animate attributeName="visibility" from="hidden" to="visible" begin="6.3s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="6.3s" repeatCount="indefinite" fill="freeze" />
    </g>

    <!-- Progress bar & loss -->
    <g transform="translate(40, 275)">
      <!-- Progress Bar Track -->
      <rect x="0" y="-12" width="200" height="14" fill="#1e2430" stroke="#2c384c" rx="3" />
      <!-- Progress Bar Fill -->
      <rect x="1" y="-11" width="0" height="12" fill="#98c379" rx="2">
        <animate attributeName="width" values="0;160;160" keyTimes="0;0.9;1" dur="1.5s" begin="6.5s" repeatCount="indefinite" fill="freeze" />
      </rect>
      <!-- Percentage Text -->
      <text x="215" y="0" class="output-success">80%</text>
      <!-- Loss Info -->
      <text x="260" y="0" class="output-info">loss: 4.872  val_loss: 5.120  (ETA: 04:12)</text>
      
      <animate attributeName="visibility" from="hidden" to="visible" begin="6.5s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="6.5s" repeatCount="indefinite" fill="freeze" />
    </g>
  </g>


  <!-- ================= SCREEN 2: CHAT PANEL ================= -->
  <g class="term-text" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.48;0.95;0.98" dur="18s" repeatCount="indefinite" />

    <!-- Chat Start Line command -->
    <g transform="translate(40, 85)">
      <text x="0" y="0"><tspan class="prompt">thomas@spaceax:~$ </tspan></text>
      <!-- Typed command with clip -->
      <text x="151" y="0" class="command" clip-path="url(#clip-cmd2)">python main.py chat</text>
      
      <!-- Blinking Cursor -->
      <rect class="cursor" x="151" y="-12" width="8" height="15">
        <animate attributeName="x" values="151;311;311" keyTimes="0;0.8;1" dur="1.5s" begin="9.0s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        <!-- Hide cursor after command types -->
        <animate attributeName="visibility" to="hidden" begin="10.8s" dur="18s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Bot Greeting -->
    <g transform="translate(40, 120)">
      <text x="0" y="0"><tspan class="bot-prompt">SpaceAx> </tspan>Halo! Ada yang bisa saya bantu? 🤖</text>
      <animate attributeName="visibility" from="hidden" to="visible" begin="11.2s" dur="18s" repeatCount="indefinite" />
      <animate attributeName="opacity" from="0" to="1" dur="0.2s" begin="11.2s" repeatCount="indefinite" fill="freeze" />
    </g>

    <!-- User Input Line -->
    <g transform="translate(40, 160)">
      <text x="0" y="0"><tspan class="user-prompt">User> </tspan></text>
      <!-- User command with clip -->
      <text x="50" y="0" class="user-command" clip-path="url(#clip-user1)">Apa arti slang gw?</text>
      
      <!-- Blinking Cursor -->
      <rect class="cursor" x="50" y="-12" width="8" height="15">
        <animate attributeName="x" values="50;202;202" keyTimes="0;0.8;1" dur="1.5s" begin="12.0s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
        <!-- Hide cursor after input types -->
        <animate attributeName="visibility" to="hidden" begin="13.8s" dur="18s" repeatCount="indefinite" />
      </rect>
      <animate attributeName="visibility" from="hidden" to="visible" begin="11.8s" dur="18s" repeatCount="indefinite" />
    </g>

    <!-- Bot Response typing -->
    <g transform="translate(40, 200)">
      <text x="0" y="0"><tspan class="bot-prompt">SpaceAx> </tspan></text>
      
      <!-- Multi-line AI response with staggered clip paths -->
      <text x="76" y="0" class="bot-reply" clip-path="url(#clip-bot-l1)">Slang "gw" terdeteksi sebagai kata gaul.</text>
      <text x="76" y="25" class="bot-reply" clip-path="url(#clip-bot-l2)">Arti baku: "saya" atau "aku".</text>
      <text x="76" y="50" class="bot-reply" clip-path="url(#clip-bot-l3)">Disinkronkan otomatis dari leksikon KBBI.</text>
      
      <!-- Blinking Cursor (Types through all 3 lines realistically) -->
      <rect class="cursor" x="76" y="-12" width="8" height="15">
        <animate attributeName="x" values="76;412;76;319;76;412" keyTimes="0;0.32;0.36;0.64;0.68;1" dur="2.5s" begin="14.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-12;-12;13;13;38;38" keyTimes="0;0.32;0.36;0.64;0.68;1" dur="2.5s" begin="14.2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      </rect>
      <animate attributeName="visibility" from="hidden" to="visible" begin="14.0s" dur="18s" repeatCount="indefinite" />
    </g>
  </g>
</svg>
