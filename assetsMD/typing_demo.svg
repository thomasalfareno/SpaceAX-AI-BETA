<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="100%" height="100%">

  <defs>

    <!-- BACKGROUND -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <!-- PANEL -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- HEADER -->
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- SHADOW -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30"
        flood-color="#000000"
        flood-opacity="0.55"/>
    </filter>

    <!-- GLOW -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- COMMAND TYPING -->
    <clipPath id="clipCommand">
      <rect x="0" y="0" width="0" height="40">
        <animate attributeName="width"
          values="0;520;520"
          keyTimes="0;0.85;1"
          dur="2.8s"
          begin="0.3s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <!-- CHAT TYPING -->
    <clipPath id="clipReply">
      <rect x="0" y="0" width="0" height="140">
        <animate attributeName="width"
          values="0;620;620"
          keyTimes="0;0.9;1"
          dur="3s"
          begin="7s"
          repeatCount="indefinite"/>
      </rect>
    </clipPath>

  </defs>

  <style>

    .bg {
      fill: url(#bg);
    }

    .window {
      fill: url(#panel);
      stroke: #243244;
      stroke-width: 1.2;
      rx: 24;
    }

    .header {
      fill: url(#header);
      stroke: #2d3748;
      stroke-width: 1;
    }

    .title {
      font-family: Inter, sans-serif;
      font-size: 17px;
      font-weight: 700;
      fill: #f8fafc;
      letter-spacing: 1px;
    }

    .text {
      font-family: "JetBrains Mono", monospace;
      font-size: 18px;
      fill: #cbd5e1;
    }

    .prompt {
      fill: #38bdf8;
      font-weight: 700;
    }

    .command {
      fill: #4ade80;
    }

    .success {
      fill: #7dd3fc;
    }

    .warning {
      fill: #facc15;
    }

    .ai {
      fill: #67e8f9;
    }

    .muted {
      fill: #64748b;
    }

    .cursor {
      fill: #38bdf8;
    }

    .footer {
      fill: #475569;
      font-size: 13px;
      font-family: Inter, sans-serif;
    }

  </style>

  <!-- BG -->
  <rect width="1400" height="800" class="bg"/>

  <!-- Glow -->
  <circle cx="1180" cy="120" r="160"
    fill="#06b6d4"
    opacity="0.08"
    filter="url(#glow)"/>

  <circle cx="220" cy="720" r="180"
    fill="#3b82f6"
    opacity="0.05"
    filter="url(#glow)"/>

  <!-- WINDOW -->
  <rect x="90"
        y="70"
        width="1220"
        height="640"
        class="window"
        filter="url(#shadow)"/>

  <!-- HEADER -->
  <path d="
    M90 96
    Q90 70 116 70
    H1284
    Q1310 70 1310 96
    V128
    H90
    Z"
    class="header"/>

  <!-- MAC BUTTON -->
  <circle cx="130" cy="100" r="8" fill="#ff5f56"/>
  <circle cx="160" cy="100" r="8" fill="#ffbd2e"/>
  <circle cx="190" cy="100" r="8" fill="#27c93f"/>

  <!-- TITLE -->
  <text x="700"
        y="106"
        text-anchor="middle"
        class="title">
    SPACEAX AI • THOMAS TERMINAL
  </text>

  <!-- LEFT TERMINAL -->
  <g class="text">

    <!-- COMMAND -->
    <g transform="translate(140,190)">

      <text x="0" y="0">
        <tspan class="prompt">thomas@spaceax:~$ </tspan>
      </text>

      <g clip-path="url(#clipCommand)">
        <text x="250" y="0" class="command">
          python main.py train --size promax --regen
        </text>
      </g>

      <!-- CURSOR -->
      <rect x="250"
            y="-17"
            width="10"
            height="20"
            class="cursor">

        <animate attributeName="x"
          values="250;760;760"
          keyTimes="0;0.85;1"
          dur="2.8s"
          begin="0.3s"
          repeatCount="indefinite"/>

        <animate attributeName="opacity"
          values="1;0;1"
          dur="0.8s"
          repeatCount="indefinite"/>
      </rect>

    </g>

    <!-- LOGS -->
    <text x="140" y="250">
      🚀 Memuat leksikon KBBI...
    </text>

    <text x="140" y="295" class="success">
      📚 112,847 kata unik berhasil dimuat
    </text>

    <text x="140" y="340">
      🏗️ Inisialisasi Model Transformer...
    </text>

    <text x="140" y="385" class="warning">
      ⚡ ProMax 1B • CUDA Enabled • VRAM-fit aktif
    </text>

    <text x="140" y="430">
      🎯 Training epoch 12/30
    </text>

    <!-- PROGRESS -->
    <rect x="140"
          y="455"
          width="420"
          height="16"
          rx="8"
          fill="#1e293b"/>

    <rect x="140"
          y="455"
          width="0"
          height="16"
          rx="8"
          fill="#22c55e">

      <animate attributeName="width"
        values="0;310;310"
        keyTimes="0;0.9;1"
        dur="2.2s"
        begin="2.4s"
        repeatCount="indefinite"/>
    </rect>

    <text x="580"
          y="468"
          class="success">
      74%
    </text>

    <text x="650"
          y="468"
          class="muted">
      val_loss: 4.87 • ETA: 04:12
    </text>

  </g>

  <!-- DIVIDER -->
  <line x1="700"
        y1="160"
        x2="700"
        y2="620"
        stroke="#243244"
        stroke-width="1"/>

  <!-- RIGHT CHAT -->
  <g class="text">

    <text x="760" y="190">
      <tspan class="prompt">thomas@spaceax:~$ </tspan>
      <tspan class="command">python main.py chat</tspan>
    </text>

    <text x="760" y="255">
      <tspan fill="#f472b6" font-weight="700">SpaceAx&gt; </tspan>
      Halo! Ada yang bisa saya bantu? 🤖
    </text>

    <text x="760" y="320">
      <tspan class="prompt">User&gt; </tspan>
      Apa itu transformer?
    </text>

    <!-- AI REPLY -->
    <g clip-path="url(#clipReply)">

      <text x="760" y="395" class="ai">
        Transformer adalah arsitektur neural network
      </text>

      <text x="760" y="435" class="ai">
        berbasis self-attention mechanism yang
      </text>

      <text x="760" y="475" class="ai">
        memproses token secara paralel untuk
      </text>

      <text x="760" y="515" class="ai">
        pemodelan bahasa skala besar.
      </text>

    </g>

    <!-- CURSOR -->
    <rect x="760"
          y="500"
          width="10"
          height="20"
          class="cursor">

      <animate attributeName="x"
        values="760;1220;1220"
        keyTimes="0;0.9;1"
        dur="3s"
        begin="7s"
        repeatCount="indefinite"/>

      <animate attributeName="opacity"
        values="1;0;1"
        dur="0.8s"
        repeatCount="indefinite"/>
    </rect>

  </g>

  <!-- FOOTER -->
  <text x="140"
        y="665"
        class="footer">
    Built from scratch by Thomas Alfareno Ananta Nugraha • Space Ax Corp • ITS Surabaya
  </text>

  <text x="1240"
        y="665"
        text-anchor="end"
        class="footer">
    SpaceAx AI v2.0.0
  </text>

</svg>
