<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="420" style="background: none;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="back-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="100%" stop-color="#0a0e1c" />
    </linearGradient>

    <!-- Component Container Gradient -->
    <linearGradient id="component-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Active Component Accent Gradient -->
    <linearGradient id="active-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="pulse-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;font-family=JetBrains+Mono:wght@300;400;500&amp;display=swap');
    
    .bg {
      fill: url(#back-grad);
      stroke: #1e293b;
      stroke-width: 1px;
    }

    .node-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      fill: #f8fafc;
      font-size: 13px;
    }

    .node-desc {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      fill: #94a3b8;
      font-size: 10px;
    }

    .node-box {
      fill: url(#component-grad);
      stroke: #334155;
      stroke-width: 1.5;
      rx: 10px;
    }

    .node-box-active {
      fill: url(#component-grad);
      stroke: #14b8a6;
      stroke-width: 2;
      rx: 10px;
      filter: url(#neon-glow-filter);
    }

    .glowing-header {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: 16px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }

    .label-mono {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #06b6d4;
      font-weight: 500;
    }

    .connector-line {
      stroke: #334155;
      stroke-width: 1.5;
      stroke-dasharray: 4,4;
      fill: none;
    }

    .connector-line-active {
      stroke: #14b8a6;
      stroke-width: 2;
      fill: none;
    }

    .particle {
      fill: #22d3ee;
      filter: url(#neon-glow-filter);
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="910" height="410" rx="14" class="bg" />

  <!-- Grid Accents -->
  <line x1="5" y1="50" x2="915" y2="50" stroke="#1d2433" stroke-width="0.5" />
  <text x="30" y="32" class="glowing-header">🧬 PIPELINE ARSITEKTUR SPACEAX AI v2.0.0</text>
  <text x="890" y="32" class="label-mono" text-anchor="end">TRANSFORMER DECODER-ONLY // PIPELINE</text>

  <!-- Flow Connectors Lines with animated pulsing dashes -->
  <g>
    <!-- Connector: User Input -> preprocessor -->
    <path d="M 170 150 L 230 150" class="connector-line-active" />
    <path d="M 170 150 L 230 150" stroke="#10b981" stroke-width="2.5" stroke-dasharray="8 30" fill="none">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Connector: preprocessor -> SpaceAx Core -->
    <path d="M 390 150 L 450 150" class="connector-line-active" />
    <path d="M 390 150 L 450 150" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 30" fill="none">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="1.8s" repeatCount="indefinite" />
    </path>

    <!-- Connector: SpaceAx Core -> Memory + Emotion (Dual way) -->
    <path d="M 535 200 L 535 250" class="connector-line-active" />
    <path d="M 535 200 L 535 250" stroke="#14b8a6" stroke-width="2.5" stroke-dasharray="8 20" fill="none">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="2s" repeatCount="indefinite" />
    </path>

    <!-- Connector: SpaceAx Core -> Validator -->
    <path d="M 620 150 L 680 150" class="connector-line-active" />
    <path d="M 620 150 L 680 150" stroke="#22d3ee" stroke-width="2.5" stroke-dasharray="8 30" fill="none">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="1.5s" repeatCount="indefinite" />
    </path>

    <!-- Connector: Validator -> Response Output -->
    <path d="M 840 150 L 890 150" class="connector-line" />
    
    <!-- Connector: Validator -> Fallback Web Search -->
    <path d="M 760 200 L 760 280" class="connector-line" stroke-dasharray="5,5" />
    <path d="M 760 280 L 170 280 M 170 280 L 170 170" class="connector-line" stroke-dasharray="4,4" />
  </g>

  <!-- Animated Flying Token Particles (Tokens traveling) -->
  <circle r="4" class="particle">
    <animateMotion path="M 170 150 L 230 150" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle r="4" class="particle">
    <animateMotion path="M 390 150 L 450 150" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle r="4" class="particle">
    <animateMotion path="M 620 150 L 680 150" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- ==================== STAGE BLOCKS (COMPONENTS) ==================== -->

  <!-- NODE 1: User Input prompt -->
  <g transform="translate(20, 100)">
    <rect width="150" height="100" class="node-box" />
    <text x="15" y="30" class="node-title">1. Masukan Pengguna</text>
    <text x="15" y="52" class="node-desc">• Kalimat Mentah / Slang</text>
    <text x="15" y="68" class="node-desc">• "gw laper bgt mo mkn"</text>
    <rect x="15" y="80" width="120" height="4" rx="2" fill="#ef4444" />
  </g>

  <!-- NODE 2: preprocessor (KBBI & Slang mapping) -->
  <g transform="translate(230, 100)">
    <rect width="160" height="100" class="node-box-active" />
    <text x="15" y="28" class="node-title">2. Leksikon Preprocess</text>
    <text x="15" y="48" class="node-desc">• combined_slang_words.txt</text>
    <text x="15" y="62" class="node-desc">• Baku: "saya lapar sangat..."</text>
    <text x="15" y="78" class="node-desc">✔️ Penyelarasan Tata Bahasa</text>
    <rect x="0" y="93" width="160" height="7" rx="3" fill="url(#pulse-grad-1)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- NODE 3: SpaceAx Transformer Core Model -->
  <g transform="translate(450, 100)">
    <rect width="170" height="100" class="node-box-active" />
    <text x="15" y="28" class="node-title">3. Model SpaceAx v2</text>
    <text x="15" y="48" class="node-desc" fill="#22d3ee">• ProMax 8B Parameter</text>
    <text x="15" y="62" class="node-desc">• RoPE Attention System</text>
    <text x="15" y="76" class="node-desc">• Generasi Log-Probabilitas</text>
    <rect x="15" y="85" width="140" height="4" rx="2" fill="#14b8a6">
      <animate attributeName="width" values="10;140;10" dur="4s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- NODE 4: Memory System & Emotion Engine -->
  <g transform="translate(450, 250)">
    <rect width="170" height="100" class="node-box" />
    <text x="15" y="28" class="node-title">4. Core Controller</text>
    <text x="15" y="48" class="node-desc" fill="#f59e0b">• 9 Variabel Emosi (Joy...)</text>
    <text x="15" y="62" class="node-desc">• STM Buffer (Konteks Prompt)</text>
    <text x="15" y="76" class="node-desc">• LTM SQLite (Fakta Sejarah)</text>
    <circle cx="145" cy="25" r="5" fill="#f59e0b">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- NODE 5: 3-Level Validator (Anti-Gibberish) -->
  <g transform="translate(680, 100)">
    <rect width="160" height="100" class="node-box-active" />
    <text x="15" y="28" class="node-title">5. Validator 3-Tingkat</text>
    <text x="15" y="48" class="node-desc">• Lvl 1: Rasio Vokal</text>
    <text x="15" y="62" class="node-desc">• Lvl 2: Leksikon KBBI Match</text>
    <text x="15" y="76" class="node-desc">• Lvl 3: Konsistensi Semantik</text>
    <rect x="15" y="85" width="130" height="4" rx="2" fill="#06b6d4" />
  </g>

  <!-- NODE 6: Web Search Fallback (DuckDuckGo Search) -->
  <g transform="translate(680, 280)">
    <rect width="160" height="90" class="node-box" stroke="#fb7185" />
    <text x="15" y="28" class="node-title" fill="#fda4af">6. Fallback ddgs API</text>
    <text x="15" y="48" class="node-desc">• Cari Google/DDG real-time</text>
    <text x="15" y="62" class="node-desc">• Scrap BeautifulSoup4</text>
    <text x="15" y="76" class="node-desc">• Input ulang ke LTM</text>
  </g>

  <!-- Legends and Watermark Info -->
  <g transform="translate(20, 360)">
    <text x="0" y="15" class="label-mono" fill="#475569">Siklus Deteksi Fallback: Jika Lvl 1-3 Gagal ➔ Pemicu Internet Scraping pencarian ➔ LTM Database up</text>
    <text x="0" y="30" class="label-mono" fill="#10b981">Thomas Alfareno Ananta Nugraha // FTEIC Teknik Informatika ITS Surabaya</text>
  </g>
</svg>
