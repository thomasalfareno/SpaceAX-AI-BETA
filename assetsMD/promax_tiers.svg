<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="850" height="350">
  <defs>
    <!-- Glow filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#00d4ff" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#a855f7" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#fbbf24" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowGoldStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#fbbf24" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Bar gradients -->
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Clip paths for rounded bar corners -->
    <clipPath id="barClip1"><rect x="30" y="248" width="200" height="12" rx="6"/></clipPath>
    <clipPath id="barClip2"><rect x="295" y="248" width="200" height="12" rx="6"/></clipPath>
    <clipPath id="barClip3"><rect x="560" y="248" width="200" height="12" rx="6"/></clipPath>
  </defs>

  <style>
    .card-title { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; }
    .card-stats { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 10px; fill: #8b949e; }
    .badge-text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; }
    .bar-label { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 9px; fill: #6e7681; }
    .heading { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 600; fill: #c9d1d9; }
  </style>

  <!-- Background -->
  <rect width="850" height="350" rx="12" fill="#0d1117"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="50" x2="850" y2="50" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="850" y2="100" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="850" y2="150" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="850" y2="200" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="850" y2="250" stroke="#c9d1d9" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="850" y2="300" stroke="#c9d1d9" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" class="heading" opacity="0">
    ProMax Model Tiers — Comparison
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.8s" fill="freeze"/>
  </text>

  <!-- ==================== CARD 1: ProMax 1B ==================== -->
  <g opacity="0" transform="translate(0, 40)">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 80" to="0 40" begin="0.6s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>

    <!-- Card background (glassmorphism) -->
    <rect x="20" y="10" width="240" height="270" rx="14" fill="#161b22" fill-opacity="0.75" stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="2s" repeatCount="indefinite"/>
    </rect>

    <!-- Inner highlight -->
    <rect x="21" y="11" width="238" height="40" rx="13" fill="#00d4ff" fill-opacity="0.04"/>

    <!-- Badge -->
    <rect x="36" y="26" width="68" height="20" rx="10" fill="#00d4ff" fill-opacity="0.15" stroke="#00d4ff" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="70" y="40" text-anchor="middle" class="badge-text" fill="#00d4ff">STARTER</text>

    <!-- Star icon -->
    <polygon points="210,32 213,38 220,39 215,43 216,50 210,47 204,50 205,43 200,39 207,38" fill="#00d4ff" fill-opacity="0.5">
      <animate attributeName="fill-opacity" values="0.3;0.7;0.3" dur="2.5s" begin="2.2s" repeatCount="indefinite"/>
    </polygon>

    <!-- Title -->
    <text x="140" y="82" text-anchor="middle" class="card-title" fill="#00d4ff">ProMax 1B</text>

    <!-- Stats -->
    <text x="140" y="108" text-anchor="middle" class="card-stats">~1.2B params</text>
    <text x="140" y="124" text-anchor="middle" class="card-stats">96k vocab</text>
    <text x="140" y="140" text-anchor="middle" class="card-stats">16GB VRAM</text>

    <!-- Divider -->
    <line x1="50" y1="155" x2="230" y2="155" stroke="#00d4ff" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Bar label -->
    <text x="38" y="178" class="bar-label">Relative Size</text>

    <!-- Bar track -->
    <rect x="36" y="188" width="188" height="10" rx="5" fill="#21262d"/>

    <!-- Bar fill (animated) -->
    <rect x="36" y="188" width="0" height="10" rx="5" fill="url(#barCyan)">
      <animate attributeName="width" from="0" to="56" begin="1.8s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>

    <!-- Params count at end of bar -->
    <text x="98" y="196" class="bar-label" fill="#00d4ff" font-size="8" opacity="0">1.2B
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- Bottom decorative dots -->
    <circle cx="120" cy="248" r="2" fill="#00d4ff" fill-opacity="0.2"/>
    <circle cx="132" cy="248" r="2" fill="#00d4ff" fill-opacity="0.3"/>
    <circle cx="144" cy="248" r="2" fill="#00d4ff" fill-opacity="0.15"/>
    <circle cx="156" cy="248" r="2" fill="#00d4ff" fill-opacity="0.25"/>
  </g>

  <!-- ==================== CARD 2: ProMax 4B ==================== -->
  <g opacity="0" transform="translate(0, 40)">
    <animate attributeName="opacity" from="0" to="1" begin="1.0s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 80" to="0 40" begin="1.0s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>

    <!-- Card background -->
    <rect x="285" y="10" width="240" height="270" rx="14" fill="#161b22" fill-opacity="0.75" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" begin="2.3s" repeatCount="indefinite"/>
    </rect>

    <!-- Inner highlight -->
    <rect x="286" y="11" width="238" height="40" rx="13" fill="#a855f7" fill-opacity="0.04"/>

    <!-- Badge -->
    <rect x="296" y="26" width="85" height="20" rx="10" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="338" y="40" text-anchor="middle" class="badge-text" fill="#a855f7">ADVANCED</text>

    <!-- Diamond icon -->
    <polygon points="475,36 481,28 487,36 481,48" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5">
      <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="2.5s" begin="2.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="475,36 481,31 487,36 481,44" fill="#a855f7" fill-opacity="0.15"/>

    <!-- Title -->
    <text x="405" y="82" text-anchor="middle" class="card-title" fill="#a855f7">ProMax 4B</text>

    <!-- Stats -->
    <text x="405" y="108" text-anchor="middle" class="card-stats">~4B params</text>
    <text x="405" y="124" text-anchor="middle" class="card-stats">128k vocab</text>
    <text x="405" y="140" text-anchor="middle" class="card-stats">24GB+ VRAM</text>

    <!-- Divider -->
    <line x1="315" y1="155" x2="495" y2="155" stroke="#a855f7" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Bar label -->
    <text x="303" y="178" class="bar-label">Relative Size</text>

    <!-- Bar track -->
    <rect x="301" y="188" width="188" height="10" rx="5" fill="#21262d"/>

    <!-- Bar fill (animated) -->
    <rect x="301" y="188" width="0" height="10" rx="5" fill="url(#barPurple)">
      <animate attributeName="width" from="0" to="112" begin="2.2s" dur="0.8s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>

    <!-- Params count -->
    <text x="420" y="196" class="bar-label" fill="#a855f7" font-size="8" opacity="0">4B
      <animate attributeName="opacity" from="0" to="1" begin="3.0s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- Bottom decorative dots -->
    <circle cx="385" cy="248" r="2" fill="#a855f7" fill-opacity="0.2"/>
    <circle cx="397" cy="248" r="2" fill="#a855f7" fill-opacity="0.3"/>
    <circle cx="409" cy="248" r="2" fill="#a855f7" fill-opacity="0.15"/>
    <circle cx="421" cy="248" r="2" fill="#a855f7" fill-opacity="0.25"/>
  </g>

  <!-- ==================== CARD 3: ProMax 8B ==================== -->
  <!-- Extra outer glow for the ultimate card -->
  <rect x="545" y="46" width="250" height="280" rx="18" fill="none" stroke="#fbbf24" stroke-width="1" stroke-opacity="0" filter="url(#glowGoldStrong)">
    <animate attributeName="stroke-opacity" values="0;0;0.3;0.15;0.3" dur="4s" begin="1.4s" fill="freeze" repeatCount="1"/>
    <animate attributeName="stroke-opacity" values="0.15;0.35;0.15" dur="3.5s" begin="5.4s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0" transform="translate(0, 40)">
    <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 80" to="0 40" begin="1.4s" dur="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>

    <!-- Card background -->
    <rect x="550" y="10" width="240" height="270" rx="14" fill="#161b22" fill-opacity="0.8" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.5s" begin="2.6s" repeatCount="indefinite"/>
    </rect>

    <!-- Inner highlight (stronger for ultimate) -->
    <rect x="551" y="11" width="238" height="50" rx="13" fill="#fbbf24" fill-opacity="0.05"/>

    <!-- Badge -->
    <rect x="561" y="26" width="80" height="20" rx="10" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.6"/>
    <text x="601" y="40" text-anchor="middle" class="badge-text" fill="#fbbf24">ULTIMATE</text>

    <!-- Crown icon -->
    <g transform="translate(740, 24)" fill="#fbbf24" fill-opacity="0.6">
      <polygon points="0,16 3,4 8,10 14,0 20,10 25,4 28,16">
        <animate attributeName="fill-opacity" values="0.4;0.9;0.4" dur="2s" begin="2.8s" repeatCount="indefinite"/>
      </polygon>
      <rect x="0" y="17" width="28" height="3" rx="1" opacity="0.5"/>
    </g>

    <!-- Title -->
    <text x="670" y="82" text-anchor="middle" class="card-title" fill="#fbbf24">ProMax 8B</text>

    <!-- Stats -->
    <text x="670" y="108" text-anchor="middle" class="card-stats">~8B params</text>
    <text x="670" y="124" text-anchor="middle" class="card-stats">160k vocab</text>
    <text x="670" y="140" text-anchor="middle" class="card-stats">40GB+ VRAM</text>

    <!-- Divider -->
    <line x1="580" y1="155" x2="760" y2="155" stroke="#fbbf24" stroke-opacity="0.15" stroke-width="1"/>

    <!-- Bar label -->
    <text x="568" y="178" class="bar-label">Relative Size</text>

    <!-- Bar track -->
    <rect x="566" y="188" width="188" height="10" rx="5" fill="#21262d"/>

    <!-- Bar fill (animated) -->
    <rect x="566" y="188" width="0" height="10" rx="5" fill="url(#barGold)">
      <animate attributeName="width" from="0" to="188" begin="2.6s" dur="0.9s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
    </rect>

    <!-- Params count -->
    <text x="762" y="196" class="bar-label" fill="#fbbf24" font-size="8" opacity="0">8B
      <animate attributeName="opacity" from="0" to="1" begin="3.5s" dur="0.4s" fill="freeze"/>
    </text>

    <!-- Bottom decorative dots -->
    <circle cx="650" cy="248" r="2" fill="#fbbf24" fill-opacity="0.2"/>
    <circle cx="662" cy="248" r="2" fill="#fbbf24" fill-opacity="0.35"/>
    <circle cx="674" cy="248" r="2" fill="#fbbf24" fill-opacity="0.15"/>
    <circle cx="686" cy="248" r="2" fill="#fbbf24" fill-opacity="0.3"/>
  </g>

  <!-- Bottom accent line -->
  <line x1="60" y1="335" x2="790" y2="335" stroke="#21262d" stroke-width="1"/>
  <line x1="60" y1="335" x2="60" y2="335" stroke="url(#barCyan)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x2" from="60" to="790" begin="3.2s" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.46 0.45 0.94"/>
  </line>
</svg>
