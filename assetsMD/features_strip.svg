<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 80" width="850" height="80">
  <defs>
    <!-- Shimmer gradient that sweeps across -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.12)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
      <animate attributeName="x1" values="-1;2" dur="4s" repeatCount="indefinite" begin="3.5s" />
      <animate attributeName="x2" values="0;3" dur="4s" repeatCount="indefinite" begin="3.5s" />
    </linearGradient>

    <!-- Badge clip paths for rounded pills -->
    <clipPath id="clip0"><rect x="10" y="20" width="108" height="40" rx="20" ry="20"/></clipPath>
    <clipPath id="clip1"><rect x="126" y="20" width="96" height="40" rx="20" ry="20"/></clipPath>
    <clipPath id="clip2"><rect x="230" y="20" width="108" height="40" rx="20" ry="20"/></clipPath>
    <clipPath id="clip3"><rect x="346" y="20" width="112" height="40" rx="20" ry="20"/></clipPath>
    <clipPath id="clip4"><rect x="466" y="20" width="100" height="40" rx="20" ry="20"/></clipPath>
    <clipPath id="clip5"><rect x="574" y="20" width="138" height="40" rx="20" ry="20"/></clipPath>
    <clipPath id="clip6"><rect x="720" y="20" width="116" height="40" rx="20" ry="20"/></clipPath>
  </defs>

  <style>
    .badge-text {
      font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e0e6f0;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
  </style>

  <!-- Very dark semi-transparent background -->
  <rect width="850" height="80" rx="12" ry="12" fill="rgba(8,10,18,0.75)" />

  <!-- ════════════════════ Badge 0: Memory STM/LTM ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <!-- Fade in + slide from left -->
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.2s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="0.2s" fill="freeze" />
    <!-- Bobbing -->
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2.5;0,0;0,2;0,0" dur="3.2s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="10" y="20" width="108" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#7c6ef0" stroke-width="1.5" />
    <rect x="10" y="20" width="108" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip0)" />
    <text x="64" y="40" class="badge-text">🧠 Memory STM/LTM</text>
  </g>

  <!-- ════════════════════ Badge 1: 9 Emotions ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="0.55s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,2;0,0;0,-2.5;0,0" dur="3.7s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="126" y="20" width="96" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#f06292" stroke-width="1.5" />
    <rect x="126" y="20" width="96" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip1)" />
    <text x="174" y="40" class="badge-text">🎭 9 Emotions</text>
  </g>

  <!-- ════════════════════ Badge 2: KBBI 112k+ ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.9s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="0.9s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,2.5;0,0" dur="3.5s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="230" y="20" width="108" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#4dd0e1" stroke-width="1.5" />
    <rect x="230" y="20" width="108" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip2)" />
    <text x="284" y="40" class="badge-text">📚 KBBI 112k+</text>
  </g>

  <!-- ════════════════════ Badge 3: BPE Tokenizer ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.25s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="1.25s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,2.5;0,0;0,-2;0,0" dur="3.9s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="346" y="20" width="112" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#ffd54f" stroke-width="1.5" />
    <rect x="346" y="20" width="112" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip3)" />
    <text x="402" y="40" class="badge-text">🔤 BPE Tokenizer</text>
  </g>

  <!-- ════════════════════ Badge 4: Web Search ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.6s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="1.6s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2.5;0,0;0,2;0,0" dur="3.3s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="466" y="20" width="100" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#69f0ae" stroke-width="1.5" />
    <rect x="466" y="20" width="100" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip4)" />
    <text x="516" y="40" class="badge-text">🌐 Web Search</text>
  </g>

  <!-- ════════════════════ Badge 5: CUDA Accelerated ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.95s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="1.95s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,2;0,0;0,-2.5;0,0" dur="3.6s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="574" y="20" width="138" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#ff8a65" stroke-width="1.5" />
    <rect x="574" y="20" width="138" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip5)" />
    <text x="643" y="40" class="badge-text">⚡ CUDA Accelerated</text>
  </g>

  <!-- ════════════════════ Badge 6: Auto Retrain ════════════════════ -->
  <g opacity="0" transform="translate(0, 0)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="2.3s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" from="-20,0" to="0,0" dur="0.5s" begin="2.3s" fill="freeze" />
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0;0,2.5;0,0" dur="3.4s" begin="3s" repeatCount="indefinite" additive="replace" />

    <rect x="720" y="20" width="116" height="40" rx="20" ry="20" fill="rgba(15,18,32,0.85)" stroke="#b39ddb" stroke-width="1.5" />
    <rect x="720" y="20" width="116" height="40" rx="20" ry="20" fill="url(#shimmer)" clip-path="url(#clip6)" />
    <text x="778" y="40" class="badge-text">🔄 Auto Retrain</text>
  </g>

  <!-- Thin top accent line with sweep glow -->
  <line x1="20" y1="8" x2="830" y2="8" stroke="rgba(124,110,240,0.15)" stroke-width="0.5" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.1;0.3;0.1" dur="4s" begin="3s" repeatCount="indefinite" />
  </line>
  <line x1="20" y1="72" x2="830" y2="72" stroke="rgba(124,110,240,0.1)" stroke-width="0.5" stroke-linecap="round">
    <animate attributeName="stroke-opacity" values="0.05;0.2;0.05" dur="4s" begin="3.5s" repeatCount="indefinite" />
  </line>
</svg>
