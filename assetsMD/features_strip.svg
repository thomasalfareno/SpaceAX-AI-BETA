<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" fill="none">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#7C6EF0"/>
      <stop offset="0.5" stop-color="#4DD0E1"/>
      <stop offset="1" stop-color="#7C6EF0"/>
    </linearGradient>

    <!-- Shimmer -->
    <linearGradient id="shimmer" x1="-1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="48%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="52%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>

      <animate attributeName="x1"
        values="-1;2"
        dur="5s"
        repeatCount="indefinite"/>

      <animate attributeName="x2"
        values="0;3"
        dur="5s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18"
        flood-color="#000"
        flood-opacity="0.45"/>
    </filter>

  </defs>

  <style>
    .title {
      font-family: Inter, Segoe UI, sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #7F8CA8;
    }

    .badgeText {
      font-family: Inter, Segoe UI, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #EAF2FF;
      dominant-baseline: middle;
      text-anchor: middle;
    }
  </style>

  <!-- Main Container -->
  <g filter="url(#shadow)">
    <rect
      x="20"
      y="20"
      width="1160"
      height="110"
      rx="28"
      fill="url(#bg)"
      stroke="rgba(255,255,255,0.05)"
      stroke-width="1"/>

    <!-- Top accent -->
    <rect
      x="20"
      y="20"
      width="1160"
      height="2"
      rx="1"
      fill="url(#accent)"/>
  </g>

  <!-- Header -->
  <text x="45" y="50" class="title">
    ADVANCED AI FEATURES
  </text>

  <!-- ================= BADGES ================= -->

  <!-- 1 -->
  <g transform="translate(40 72)">
    <rect width="160" height="38" rx="19"
      fill="#121C2B"
      stroke="#7C6EF0"
      stroke-width="1.2"/>

    <rect width="160" height="38" rx="19"
      fill="url(#shimmer)"/>

    <text x="80" y="20" class="badgeText">
      🧠 Memory System
    </text>
  </g>

  <!-- 2 -->
  <g transform="translate(215 72)">
    <rect width="140" height="38" rx="19"
      fill="#121C2B"
      stroke="#F06292"
      stroke-width="1.2"/>

    <rect width="140" height="38" rx="19"
      fill="url(#shimmer)"/>

    <text x="70" y="20" class="badgeText">
      🎭 Emotion Engine
    </text>
  </g>

  <!-- 3 -->
  <g transform="translate(370 72)">
    <rect width="145" height="38" rx="19"
      fill="#121C2B"
      stroke="#4DD0E1"
      stroke-width="1.2"/>

    <rect width="145" height="38" rx="19"
      fill="url(#shimmer)"/>

    <text x="72.5" y="20" class="badgeText">
      📚 KBBI Dataset
    </text>
  </g>

  <!-- 4 -->
  <g transform="translate(530 72)">
    <rect width="155" height="38" rx="19"
      fill="#121C2B"
      stroke="#FFD54F"
      stroke-width="1.2"/>

    <rect width="155" height="38" rx="19"
      fill="url(#shimmer)"/>

    <text x="77.5" y="20" class="badgeText">
      🔤 BPE Tokenizer
    </text>
  </g>

  <!-- 5 -->
  <g transform="translate(700 72)">
    <rect width="145" height="38" rx="19"
      fill="#121C2B"
      stroke="#69F0AE"
      stroke-width="1.2"/>

    <rect width="145" height="38" rx="19"
      fill="url(#shimmer)"/>

    <text x="72.5" y="20" class="badgeText">
      🌐 Web Search
    </text>
  </g>

  <!-- 6 -->
  <g transform="translate(860 72)">
    <rect width="185" height="38" rx="19"
      fill="#121C2B"
      stroke="#FF8A65"
      stroke-width="1.2"/>

    <rect width="185" height="38" rx="19"
      fill="url(#shimmer)"/>

    <text x="92.5" y="20" class="badgeText">
      ⚡ CUDA Acceleration
    </text>
  </g>

</svg>
