<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="400" style="background: none;">
  <defs>
    <!-- Dark Cosmic Linear Gradient -->
    <linearGradient id="circ-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04060c" />
      <stop offset="100%" stop-color="#090d19" />
    </linearGradient>

    <!-- Glowing Vector Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <linearGradient id="neon-emerald-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="rope-spiral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Shader Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@300;400;500&amp;display=swap');
    
    .block-base {
      fill: url(#circ-bg);
      stroke: #1e293b;
      stroke-width: 1.5;
    }
    
    .label-display {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      fill: #f8fafc;
      font-size: 13px;
    }

    .label-desc {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 400;
      fill: #94a3b8;
      font-size: 10px;
    }

    .label-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #22d3ee;
    }

    .grid-lines-subtle {
      stroke: #10b981;
      stroke-opacity: 0.04;
      stroke-width: 0.5px;
    }

    /* RoPE Spiral Axis spin effect */
    .rope-spin-group {
      animation: rotate-axis 20s linear infinite;
      transform-origin: 220px 210px;
    }

    @keyframes rotate-axis {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Pulse effect on attention matrix cells */
    .matrix-pulse {
      animation: cell-pulse 3s ease-in-out infinite alternate;
    }

    @keyframes cell-pulse {
      0% { fill-opacity: 0.1; stroke-opacity: 0.2; }
      100% { fill-opacity: 0.6; stroke-opacity: 0.8; }
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="910" height="390" rx="14" class="block-base" />

  <!-- Cybernetic Grid Map lines -->
  <g class="grid-lines-subtle">
    <line x1="5" y1="60" x2="915" y2="60" />
    <line x1="5" y1="120" x2="915" y2="120" />
    <line x1="5" y1="180" x2="915" y2="180" />
    <line x1="5" y1="240" x2="915" y2="240" />
    <line x1="5" y1="300" x2="915" y2="300" />
    <line x1="460" y1="5" x2="460" y2="395" />
  </g>

  <!-- Header Section -->
  <g transform="translate(30, 36)">
    <text class="label-display" font-size="16" font-weight="800">📐 ROTARY POSITION EMBEDDING (RoPE) &amp; ATTENTION ENGINE</text>
    <text x="860" y="2" class="label-code" text-anchor="end">SPACEAX_MODEL // CORE_STRUCTURE</text>
  </g>

  <!-- LEFT COLUMN: ROTARY EMBEDDINGS (RoPE) VISUAL SPACE -->
  <g transform="translate(20, 70)">
    <!-- Section Border -->
    <rect width="400" height="300" rx="12" fill="none" stroke="#1d2433" stroke-width="1.5" />
    <text x="20" y="30" class="label-display">Posisi Berputar (Rotary Position)</text>
    <text x="20" y="48" class="label-desc">Menggantikan Absolut Bias dengan Rotasi 2D Complex Vector</text>

    <!-- Interactive Coordinate Circle -->
    <g transform="translate(200, 180)">
      <!-- Target rings -->
      <circle r="90" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle r="60" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
      <circle r="30" fill="none" stroke="#1e293b" stroke-width="1" />
      
      <!-- Coordinate Axis -->
      <line x1="-110" y1="0" x2="110" y2="0" stroke="#1e293b" stroke-width="1" />
      <line x1="0" y1="-110" x2="0" y2="110" stroke="#1e293b" stroke-width="1" />

      <!-- Rotating vectors -->
      <g class="rope-spin-group">
        <!-- Spiral dynamic line paths -->
        <path d="M 0 0 Q 30 20 60 -30 T 90 -40" fill="none" stroke="url(#rope-spiral)" stroke-width="2.5" />
        
        <!-- Vector Token Query q_m -->
        <line x1="0" y1="0" x2="68" y2="-50" stroke="#10b981" stroke-width="3" filter="url(#subtle-glow)" />
        <circle cx="68" cy="-50" r="5" fill="#10b981" filter="url(#neon-glow)" />
        <text x="76" y="-55" class="label-code">q_m (Token m)</text>

        <!-- Vector Token Key k_n with angle rotation theta -->
        <line x1="0" y1="0" x2="-40" y2="-75" stroke="#06b6d4" stroke-width="3" filter="url(#subtle-glow)" />
        <circle cx="-40" cy="-75" r="5" fill="#06b6d4" filter="url(#neon-glow)" />
        <text x="-115" y="-80" class="label-code">k_n (Rotated n*θ)</text>

        <!-- Angle indication arc -->
        <path d="M 34 -25 A 42 42 0 0 0 -16 -30" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="2,2" />
      </g>
    </g>

    <!-- Formula overlay text box -->
    <rect x="230" y="20" width="150" height="40" rx="6" fill="#030712" stroke="#1e293b" />
    <text x="242" y="38" class="label-code" font-size="9" fill="#10b981">R_θ^d * x = e^(i*m*θ) * x_m</text>
  </g>

  <!-- RIGHT COLUMN: MULTI-HEAD CASUAL MASKED ATTENTION MATRIX -->
  <g transform="translate(480, 70)">
    <!-- Section Border -->
    <rect width="410" height="300" rx="12" fill="none" stroke="#1d2433" stroke-width="1.5" />
    <text x="20" y="30" class="label-display">Matriks Atensi Kausal (Masked Self-Attention)</text>
    <text x="20" y="48" class="label-desc">Mencegah Kebocoran Token Kedepan (Hanya token n &lt;= m dapat berinteraksi)</text>

    <!-- Matrix Visualization Grid block -->
    <g transform="translate(40, 90)">
      <!-- Draw grid cells and highlight active attention states -->
      <!-- Header labels (Token Key) -->
      <text x="35" y="-15" class="label-code" font-size="9" text-anchor="middle">saya</text>
      <text x="85" y="-15" class="label-code" font-size="9" text-anchor="middle">lapar</text>
      <text x="135" y="-15" class="label-code" font-size="9" text-anchor="middle">sangat</text>
      <text x="185" y="-15" class="label-code" font-size="9" text-anchor="middle">[PAD]</text>

      <!-- Row labels (Token Query) -->
      <text x="-15" y="25" class="label-code" font-size="9" text-anchor="end">saya</text>
      <text x="-15" y="75" class="label-code" font-size="9" text-anchor="end">lapar</text>
      <text x="-15" y="125" class="label-code" font-size="9" text-anchor="end">sangat</text>
      <text x="-15" y="175" class="label-code" font-size="9" text-anchor="end">[PAD]</text>

      <!-- Row 1 cells -->
      <rect x="10" y="5" width="48" height="40" rx="4" fill="#047857" fill-opacity="0.8" stroke="#10b981" class="matrix-pulse" />
      <rect x="60" y="5" width="48" height="40" rx="4" fill="#020617" stroke="#1e293b" />
      <text x="84" y="28" class="label-code" text-anchor="middle" font-size="8" fill="#475569">-inf</text>
      <rect x="110" y="5" width="48" height="40" rx="4" fill="#020617" stroke="#1e293b" />
      <text x="134" y="28" class="label-code" text-anchor="middle" font-size="8" fill="#475569">-inf</text>
      <rect x="160" y="5" width="48" height="40" rx="4" fill="#020617" stroke="#1e293b" />
      <text x="184" y="28" class="label-code" text-anchor="middle" font-size="8" fill="#475569">-inf</text>

      <!-- Row 2 cells -->
      <rect x="10" y="55" width="48" height="40" rx="4" fill="#0f766e" fill-opacity="0.5" stroke="#14b8a6" />
      <rect x="60" y="55" width="48" height="40" rx="4" fill="#047857" fill-opacity="0.9" stroke="#10b981" class="matrix-pulse" />
      <rect x="110" y="55" width="48" height="40" rx="4" fill="#020617" stroke="#1e293b" />
      <text x="134" y="78" class="label-code" text-anchor="middle" font-size="8" fill="#475569">-inf</text>
      <rect x="160" y="55" width="48" height="40" rx="4" fill="#020617" stroke="#1e293b" />
      <text x="184" y="78" class="label-code" text-anchor="middle" font-size="8" fill="#475569">-inf</text>

      <!-- Row 3 cells -->
      <rect x="10" y="105" width="48" height="40" rx="4" fill="#115e59" fill-opacity="0.3" stroke="#0d9488" />
      <rect x="60" y="105" width="48" height="40" rx="4" fill="#0f766e" fill-opacity="0.7" stroke="#14b8a6" />
      <rect x="110" y="105" width="48" height="40" rx="4" fill="#047857" fill-opacity="0.95" stroke="#10b981" />
      <rect x="160" y="105" width="48" height="40" rx="4" fill="#020617" stroke="#1e293b" />
      <text x="184" y="128" class="label-code" text-anchor="middle" font-size="8" fill="#475569">-inf</text>

      <!-- Row 4 cells -->
      <rect x="10" y="155" width="48" height="40" rx="4" fill="#115e59" fill-opacity="0.1" stroke="#0d9488" />
      <rect x="60" y="155" width="48" height="40" rx="4" fill="#115e59" fill-opacity="0.2" stroke="#0d9488" />
      <rect x="110" y="155" width="48" height="40" rx="4" fill="#115e59" fill-opacity="0.4" stroke="#0d9488" />
      <rect x="160" y="155" width="48" height="40" rx="4" fill="#047857" fill-opacity="0.9" stroke="#10b981" />
    </g>

    <!-- Side indicator label -->
    <g transform="translate(280, 100)">
      <line x1="0" y1="0" x2="30" y2="40" stroke="#10b981" stroke-width="1.5" />
      <circle cx="30" cy="40" r="3" fill="#10b981" />
      <text x="35" y="44" class="label-code" font-size="9">Upper Triangle Mask</text>
      <text x="35" y="56" class="label-desc" font-size="8">Dihubung ke -inf (Kausalitas)</text>
    </g>
  </g>

  <!-- Foot decoration metadata -->
  <g transform="translate(30, 385)">
    <text class="label-desc" font-size="8">SINKRONISASI COK_DIMENSIONAL // MODEL DECODER-ONLY SPACEAX // 12-06-2026</text>
  </g>
</svg>
