<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>

    <!-- Top accent line gradient -->
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="15%" stop-color="#6c63ff"/>
      <stop offset="35%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="65%" stop-color="#00d4ff"/>
      <stop offset="85%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>

    <!-- Animated shimmer gradient for the line -->
    <linearGradient id="lineShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="10%" stop-color="#6c63ff">
        <animate attributeName="stop-color" values="#6c63ff;#00d4ff;#ff6ec7;#6c63ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="30%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#ff6ec7;#6c63ff;#00d4ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff6ec7">
        <animate attributeName="stop-color" values="#ff6ec7;#6c63ff;#00d4ff;#ff6ec7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#00d4ff">
        <animate attributeName="stop-color" values="#00d4ff;#ff6ec7;#6c63ff;#00d4ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="90%" stop-color="#6c63ff">
        <animate attributeName="stop-color" values="#6c63ff;#00d4ff;#ff6ec7;#6c63ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1a0533"/>
    </linearGradient>

    <!-- Heart shape path -->
    <path id="heartPath" d="M0,-6 C0,-9 -4,-10 -6,-8 C-8,-6 -8,-3 0,4 C8,-3 8,-6 6,-8 C4,-10 0,-9 0,-6 Z"/>

    <!-- Glow filter for line -->
    <filter id="lineGlow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for stars -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Heart glow -->
    <filter id="heartGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .main-text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #ffffff; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
    .sub-text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #a0a0c0; font-size: 11px; font-weight: 400; letter-spacing: 0.8px; }
    .dim-text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; fill: #5a5a80; font-size: 10px; font-weight: 400; letter-spacing: 1px; }
  </style>

  <!-- Background -->
  <rect width="900" height="120" fill="url(#bgGrad)" rx="0"/>

  <!-- ===== TWINKLING STARS ===== -->
  <!-- Row 1 - scattered across top area -->
  <circle cx="45" cy="18" r="1" fill="#ffffff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.2s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="35" r="0.7" fill="#c8c8ff" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="14" r="0.9" fill="#ffffff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.85;0" dur="4.1s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="28" r="0.6" fill="#a0d0ff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" begin="2.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="310" cy="42" r="0.8" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="16" r="1.1" fill="#d0c0ff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.75;0" dur="3.8s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="30" r="0.5" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.65;0" dur="4.5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="530" cy="20" r="0.9" fill="#a0d0ff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.9;0" dur="3.0s" begin="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="38" r="0.6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.55;0" dur="3.3s" begin="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="15" r="0.8" fill="#c8c8ff" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="32" r="1.0" fill="#ffffff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.85;0" dur="4.0s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="22" r="0.7" fill="#d0c0ff" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.6s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="870" cy="40" r="0.9" fill="#ffffff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.7s" begin="0.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Row 2 - scattered across bottom area -->
  <circle cx="75" cy="85" r="0.7" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="95" r="0.5" fill="#a0d0ff" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4.2s" begin="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="230" cy="105" r="0.8" fill="#ffffff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.8;0" dur="3.1s" begin="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="90" r="0.6" fill="#c8c8ff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.7s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="490" cy="100" r="0.9" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.75;0" dur="2.6s" begin="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="88" r="0.7" fill="#d0c0ff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.85;0" dur="3.9s" begin="0.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="102" r="0.5" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="4.3s" begin="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="92" r="0.8" fill="#a0d0ff" opacity="0">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.0s" begin="1.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="855" cy="108" r="0.6" fill="#ffffff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.65;0" dur="3.5s" begin="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Extra scattered stars in mid area -->
  <circle cx="30" cy="55" r="0.5" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.55;0" dur="4.0s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="65" r="0.7" fill="#c8c8ff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.2s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="110" r="0.6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.8s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="55" r="0.8" fill="#d0c0ff" opacity="0" filter="url(#starGlow)">
    <animate attributeName="opacity" values="0;0.75;0" dur="2.9s" begin="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="830" cy="65" r="0.6" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0.6;0" dur="4.4s" begin="0.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== TOP GRADIENT LINE ===== -->
  <!-- Glow layer -->
  <rect x="50" y="0" width="800" height="2" rx="1" fill="url(#lineShimmer)" opacity="0.5" filter="url(#lineGlow)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Main line -->
  <rect x="50" y="0" width="800" height="1.5" rx="0.75" fill="url(#lineShimmer)" opacity="0.9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- ===== TEXT CONTENT ===== -->

  <!-- Main text: "Built with ❤️ by Thomas Alfareno Ananta Nugraha" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.3s" fill="freeze"/>

    <!-- "Built with" -->
    <text x="327" y="42" class="main-text" text-anchor="end">Built with</text>

    <!-- Animated Heart Shape -->
    <g transform="translate(345, 36)">
      <g filter="url(#heartGlow)">
        <use href="#heartPath" fill="#ff4466" opacity="0.4">
          <animateTransform attributeName="transform" type="scale" values="1;1.3;1" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.4;0.15;0.4" dur="1.2s" repeatCount="indefinite"/>
        </use>
      </g>
      <use href="#heartPath" fill="#ff2255">
        <animateTransform attributeName="transform" type="scale" values="1;1.15;1" dur="1.2s" repeatCount="indefinite"/>
      </use>
    </g>

    <!-- "by Thomas Alfareno Ananta Nugraha" -->
    <text x="363" y="42" class="main-text" text-anchor="start">by Thomas Alfareno Ananta Nugraha</text>
  </g>

  <!-- Subtitle: "Teknik Informatika • FTEIC • ITS Surabaya" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="0.8s" fill="freeze"/>
    <text x="450" y="65" class="sub-text" text-anchor="middle">Teknik Informatika  •  FTEIC  •  ITS Surabaya</text>
  </g>

  <!-- Copyright: "Space Ax Corp © 2026" -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1.5s" begin="1.3s" fill="freeze"/>
    <text x="450" y="85" class="dim-text" text-anchor="middle">Space Ax Corp © 2026</text>
  </g>

  <!-- Decorative dots on the sides -->
  <circle cx="200" cy="60" r="1" fill="#6c63ff" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="1" fill="#6c63ff" opacity="0">
    <animate attributeName="opacity" values="0;0.3;0" dur="5s" begin="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
