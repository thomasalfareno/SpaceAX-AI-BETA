<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e29" />
      <stop offset="50%" stop-color="#120c38" />
      <stop offset="100%" stop-color="#1e0533" />
    </linearGradient>

    <!-- Title Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Text Clip Path for Typing Animation -->
    <clipPath id="type-clip">
      <rect x="0" y="0" width="0" height="300">
        <animate attributeName="width" from="0" to="900" dur="2.5s" begin="0.5s" fill="freeze" keyTimes="0;1" keySplines="0.4 0 0.2 1" calcMode="spline" />
      </rect>
    </clipPath>

    <!-- Line Shimmer Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .star {
      fill: #ffffff;
      opacity: 0;
    }
    .title-text {
      font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #ffffff;
      letter-spacing: 2px;
    }
    .title-glow {
      fill: #00f2fe;
      filter: url(#glow);
      opacity: 0.8;
    }
    .subtitle-text {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 18px;
      fill: #00f2fe;
      letter-spacing: 4px;
      font-weight: 600;
      opacity: 0;
    }
    .tagline-text {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-size: 13px;
      fill: #8a99ad;
      letter-spacing: 1.5px;
      opacity: 0;
    }
    .cursor {
      fill: #00f2fe;
    }
  </style>

  <!-- Background -->
  <rect width="900" height="300" fill="url(#bg-gradient)" />

  <!-- Twinkling Stars (SMIL) -->
  <!-- Star group 1 -->
  <circle cx="75" cy="50" r="1.5" class="star">
    <animate attributeName="opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" begin="0.1s" />
  </circle>
  <circle cx="150" cy="180" r="1" class="star">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  <circle cx="280" cy="80" r="2" class="star">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="1.2s" />
  </circle>
  <circle cx="420" cy="40" r="1" class="star">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.5s" repeatCount="indefinite" begin="0.3s" />
  </circle>
  <circle cx="580" cy="90" r="1.5" class="star">
    <animate attributeName="opacity" values="0;0.7;0" dur="3s" repeatCount="indefinite" begin="0.8s" />
  </circle>
  <circle cx="720" cy="60" r="2" class="star">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.8s" repeatCount="indefinite" begin="1.5s" />
  </circle>
  <circle cx="810" cy="150" r="1" class="star">
    <animate attributeName="opacity" values="0;0.5;0" dur="4s" repeatCount="indefinite" begin="0.2s" />
  </circle>
  <circle cx="850" cy="50" r="1.5" class="star">
    <animate attributeName="opacity" values="0;0.8;0" dur="3.2s" repeatCount="indefinite" begin="0.9s" />
  </circle>
  
  <!-- Star group 2 -->
  <circle cx="110" cy="120" r="1" class="star">
    <animate attributeName="opacity" values="0;0.6;0" dur="3.8s" repeatCount="indefinite" begin="1.1s" />
  </circle>
  <circle cx="230" cy="220" r="1.5" class="star">
    <animate attributeName="opacity" values="0;0.7;0" dur="3.2s" repeatCount="indefinite" begin="2.3s" />
  </circle>
  <circle cx="340" cy="140" r="1" class="star">
    <animate attributeName="opacity" values="0;0.4;0" dur="4.2s" repeatCount="indefinite" begin="0.5s" />
  </circle>
  <circle cx="490" cy="160" r="2" class="star">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.7s" repeatCount="indefinite" begin="1.7s" />
  </circle>
  <circle cx="650" cy="200" r="1" class="star">
    <animate attributeName="opacity" values="0;0.5;0" dur="3.6s" repeatCount="indefinite" begin="0.4s" />
  </circle>
  <circle cx="780" cy="220" r="1.5" class="star">
    <animate attributeName="opacity" values="0;0.8;0" dur="3.1s" repeatCount="indefinite" begin="2.1s" />
  </circle>

  <!-- Title & Typing Animation -->
  <g transform="translate(0, 40)">
    <!-- Main Header -->
    <g clip-path="url(#type-clip)">
      <!-- Glow Layer -->
      <text x="450" y="80" text-anchor="middle" class="title-text title-glow">SpaceAx AI</text>
      <!-- Base Text -->
      <text x="450" y="80" text-anchor="middle" class="title-text">SpaceAx AI</text>
    </g>

    <!-- Typing Cursor -->
    <rect class="cursor" y="38" width="4" height="48">
      <!-- Cursor blinking -->
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
      <!-- Cursor movement to match clip path -->
      <animate attributeName="x" from="290" to="610" dur="2.5s" begin="0.5s" fill="freeze" keyTimes="0;1" keySplines="0.4 0 0.2 1" calcMode="spline" />
      <!-- Hide cursor after typing is done and some blinks -->
      <animate attributeName="visibility" to="hidden" begin="4s" fill="freeze" />
    </rect>

    <!-- Subtitle (fades in after typing is complete) -->
    <text x="450" y="130" text-anchor="middle" class="subtitle-text">
      MESIN PERCAKAPAN BAHASA INDONESIA
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.8s" fill="freeze" />
    </text>

    <!-- Tagline (fades in slightly after subtitle) -->
    <text x="450" y="165" text-anchor="middle" class="tagline-text">
      Transformer Decoder-Only  •  Dilatih dari Nol  •  Versi 2.0.0
      <animate attributeName="opacity" from="0" to="0.8" dur="1s" begin="3.4s" fill="freeze" />
    </text>
  </g>

  <!-- Bottom Separator with Animated Glow -->
  <g transform="translate(0, 298)">
    <line x1="50" y1="0" x2="850" y2="0" stroke="url(#line-grad)" stroke-width="2">
      <animate attributeName="stroke-width" values="1;3;1" dur="4s" repeatCount="indefinite" />
    </line>
    <!-- Glowing light beam traveling along the line -->
    <circle cx="50" cy="0" r="3" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="cx" from="50" to="850" dur="6s" repeatCount="indefinite" keyTimes="0;1" keySplines="0.25 0.1 0.25 1" calcMode="spline" />
      <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
